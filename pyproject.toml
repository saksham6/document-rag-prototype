[project]
name = "document-rag-prototype"
version = "0.1.0"
description = "Retrieval-first RAG prototype for TXT and PDF documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "azure-storage-blob>=12.30.0",
    "fastapi>=0.136.1",
    "openai>=2.36.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pymupdf>=1.27.2.3",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
    "transformers>=5.6.2",
]

dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
